spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET}

file:
  storage:
    location: ${FILE_STORAGE_LOCATION:uploads}

scheduler:
  file-cleanup:
    enabled: ${FILE_CLEANUP_ENABLED:true}