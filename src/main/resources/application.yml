spring:
  datasource:
    url: jdbc:mysql://localhost:3306/library_db
    username: root
    password: YOUR_MySQL_PASSWORD_PLEASE

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
